name: Build, Test and Push Microservices

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # JOB 1: Build, test and push microservices to GHCR
  # ============================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: ms-usuarios
            path: ./Microserv_Users
            port: 3001
          - service: ms-tareas
            path: ./Microserv_Tareas
            port: 3002
          - service: ms-notas
            path: ./Microserv_Notas
            port: 3003
          - service: ms-asistencia
            path: ./Microserv_Asistencias
            port: 3004
          - service: ms-frontend
            path: ./frontend-tesis
            port: 80
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          echo "Installing dependencies for ${{ matrix.service }}..."
          npm ci

      - name: Run Linting
        working-directory: ${{ matrix.path }}
        run: |
          echo "Running linting on ${{ matrix.service }}..."
          if npm run lint --if-present; then
            echo "Linting passed for ${{ matrix.service }}"
          else
            echo "Linting failed for ${{ matrix.service }}"
            exit 1
          fi

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: |
          echo "Running tests on ${{ matrix.service }}..."
          npm test
          echo "Tests passed for ${{ matrix.service }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            SERVICE_PORT=${{ matrix.port }}

      - name: Verify image push
        if: github.event_name != 'pull_request'
        run: |
          echo "Image ${{ matrix.service }} built and pushed to GHCR"
          echo "Registry: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"

  # ============================================
  # JOB 2: Deploy ALL services to Minikube
  # ============================================
  deploy-to-minikube:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push'

    strategy:
      matrix:
        service: [ms-usuarios, ms-tareas, ms-notas, ms-asistencia, ms-frontend]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tools
        shell: powershell
        run: |
          Write-Host "Verifying installed tools..."
          docker --version
          minikube version
          kubectl version --client

      - name: Load latest image to Minikube (frontend only)
        if: matrix.service == 'ms-frontend'
        working-directory: ./frontend-tesis
        shell: powershell
        run: |
          Write-Host "Building frontend Docker image..."
          docker build --no-cache -t ms-frontend:latest .
          Write-Host "Loading image to Minikube..."
          minikube image load ms-frontend:latest
          Write-Host "Image loaded successfully"

      - name: Verify Minikube is running
        shell: powershell
        run: |
          Write-Host "Checking Minikube status..."
          minikube status
          kubectl get nodes

      - name: Update deployment image
        shell: powershell
        run: |
          if ("${{ matrix.service }}" -eq "ms-frontend") {
            kubectl set image deployment/${{ matrix.service }} ${{ matrix.service }}=ms-frontend:latest
          } else {
            kubectl set image deployment/${{ matrix.service }} ${{ matrix.service }}=ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          }
      - name: Verify rollout
        shell: powershell
        run: |
          Write-Host "Waiting for rollout of ${{ matrix.service }}..."
          kubectl rollout status deployment/${{ matrix.service }} --timeout=5m
          Write-Host "Rollout of ${{ matrix.service }} completed"

      - name: Check pod status
        shell: powershell
        run: |
          Write-Host "Pod status for ${{ matrix.service }}:"
          kubectl get pods -l app=${{ matrix.service }}
          kubectl get svc ${{ matrix.service }}-service 2>$null

      - name: Deployment summary
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "${{ matrix.service }} deployed successfully"
          Write-Host "Image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"
          Write-Host "========================================"

  # ============================================
  # JOB 3: Success notification
  # ============================================
  notify-success:
    name: Notify pipeline success
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-minikube]
    if: github.event_name == 'push' && success()

    steps:
      - name: Notify success
        run: |
          echo "========================================"
          echo "PIPELINE CI/CD COMPLETED SUCCESSFULLY"
          echo "========================================"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Target environment: Minikube"
          echo "========================================"

  # ============================================
  # JOB 4: Failure notification
  # ============================================
  notify-failure:
    name: Notify pipeline failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-minikube]
    if: github.event_name == 'push' && failure()

    steps:
      - name: Notify failure
        run: |
          echo "========================================"
          echo "PIPELINE CI/CD FAILED"
          echo "========================================"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs for more details"
          echo "========================================"
          exit 1