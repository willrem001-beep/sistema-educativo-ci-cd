name: Build and Push Microservices

on:
  push:
    branches: [ "main" ]
    paths-ignore: # Opcional: ignorar cambios en docs
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }} 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write 

    strategy:
      matrix:
        include:
          - service: ms-usuarios
            path: ./Microserv_Usuarios
            port: 3001
          - service: ms-tareas
            path: ./Microserv_Tareas
            port: 3002
          - service: ms-notas
            path: ./Microserv_Notas
            port: 3003
          - service: ms-asistencia
            path: ./Microserv_Asistencias
            port: 3004
      fail-fast: false # No cancelar otros servicios si uno falla

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obtener todo el historial para metadatos

      # --- NUEVO PASO: Instalar Node.js para ejecutar tests ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # --- NUEVO PASO: Ejecutar Tests ---
      - name: Install Dependencies & Run Tests
        working-directory: ${{ matrix.path }}
        run: |
          echo "Ejecutando tests en ${{ matrix.service }}..."
          npm ci
          npm test
          echo "Tests pasados para ${{ matrix.service }}"
      # -------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host # Mejor rendimiento de red

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # timeout-minutes: 5

      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Microservicio ${{ matrix.service }}
            org.opencontainers.image.version=${{ github.sha }}
            maintainer=${{ github.repository_owner }}

      - name: Construir y Push de Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }} # Solo push si no es PR
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            SERVICE_PORT=${{ matrix.port }}

      - name: Verificar imagen (opcional)
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          echo "Imagen ${{ matrix.service }} publicada correctamente"
          
      - name: Notificar fallo (opcional)
        if: failure()
        run: |
          echo "Falló la construcción o tests de ${{ matrix.service }}"
          # Aquí podrías agregar integración con Slack/Discord
