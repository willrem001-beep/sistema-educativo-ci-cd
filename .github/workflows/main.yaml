name: Build and Push Microservices

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # JOB 1: Construir y subir microservicios a GHCR
  # ============================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: ms-usuarios
            path: ./Microserv_Users
            port: 3001
            allow-test-failure: true
          - service: ms-tareas
            path: ./Microserv_Tareas
            port: 3002
            allow-test-failure: true
          - service: ms-notas
            path: ./Microserv_Notas
            port: 3003
            allow-test-failure: true
          - service: ms-asistencia
            path: ./Microserv_Asistencias
            port: 3004
            allow-test-failure: true
          - service: ms-frontend
            path: ./frontend-tesis
            port: 80
            allow-test-failure: true
      fail-fast: false

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Tests
        working-directory: ${{ matrix.path }}
        run: |
          echo "Ejecutando tests en ${{ matrix.service }}..."
          npm ci
          npm test || ${{ matrix.allow-test-failure && 'true' || 'exit 1' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}

      - name: Construir y Push de Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            SERVICE_PORT=${{ matrix.port }}

      - name: Verificar imagen
        if: github.event_name != 'pull_request'
        run: |
          echo "Imagen ${{ matrix.service }} construida y subida a GHCR"

  # ============================================
  # JOB 2: Desplegar frontend en Minikube local
  # ============================================
  deploy-frontend:
    name: Deploy Frontend to Minikube
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
      
      - name: Verificar herramientas
        shell: powershell
        run: |
          Write-Host "Verificando herramientas instaladas..."
          docker --version
          minikube version
          kubectl version --client
      
      - name: Construir imagen Docker del frontend
        working-directory: ./frontend-tesis
        shell: powershell
        run: |
          Write-Host "Construyendo imagen Docker del frontend..."
          docker build --no-cache -t ms-frontend:latest .
          docker images | findstr ms-frontend
      
      - name: Cargar imagen a Minikube
        shell: powershell
        run: |
          Write-Host "Cargando imagen a Minikube..."
          minikube image load ms-frontend:latest
          Write-Host "Imagen cargada correctamente"
      
      - name: Verificar que Minikube esta corriendo
        shell: powershell
        run: |
          Write-Host "Verificando estado de Minikube..."
          minikube status
          kubectl get nodes
      
      - name: Actualizar deployment ms-frontend
        shell: powershell
        run: |
          Write-Host "Actualizando deployment ms-frontend con nueva imagen..."
          kubectl set image deployment/ms-frontend ms-frontend=ms-frontend:latest
          Write-Host "Esperando 30 segundos para actualizacion..."
          Start-Sleep -Seconds 30
          Write-Host "Verificando pods..."
          kubectl get pods -l app=ms-frontend
      
      - name: Verificar estado de los pods
        shell: powershell
        run: |
          Write-Host "Estado de los pods:"
          kubectl get pods -l app=ms-frontend
          kubectl get svc ms-frontend-service
    