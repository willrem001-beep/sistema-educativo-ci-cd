name: Build, Test and Push Microservices

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  DOCKER_REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # JOB 1: Build, test and push microservices
  # ============================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: ms-usuarios
            path: ./croserv_Users
            port: 3001
            docker_user: r3mr1z4
          - service: ms-tareas
            path: ./Microserv_Tareas
            port: 3002
            docker_user: r3mr1z4
          - service: ms-notas
            path: ./Microserv_Notas
            port: 3003
            docker_user: r3mr1z4
          - service: ms-asistencia
            path: ./Microserv_Asistencias
            port: 3004
            docker_user: r3mr1z4
          - service: ms-frontend
            path: ./frontend-tesis
            port: 80
            docker_user: r3mr1z4
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          echo "Installing dependencies for ${{ matrix.service }}..."
          npm ci

      - name: Run Linting
        working-directory: ${{ matrix.path }}
        run: |
          echo "Running linting on ${{ matrix.service }}..."
          if npm run lint --if-present; then
            echo "Linting passed for ${{ matrix.service }}"
          else
            echo "Linting failed for ${{ matrix.service }}"
            exit 1
          fi

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: |
          echo "Running tests on ${{ matrix.service }}..."
          npm test
          echo "Tests passed for ${{ matrix.service }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Debug Docker Hub secrets
        shell: bash
        run: |
          echo "🔍 Verificando secrets de Docker Hub..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo " DOCKER_USERNAME no está configurado"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo " DOCKER_TOKEN no está configurado"
            exit 1
          fi
          echo " Secrets configurados correctamente"
      # Login a Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Login a GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.docker_user }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.docker_user }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.docker_user }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            SERVICE_PORT=${{ matrix.port }}

      - name: Verify image push
        if: github.event_name != 'pull_request'
        run: |
          echo "Images for ${{ matrix.service }} pushed to:"
          echo "  - GHCR: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"
          echo "  - Docker Hub: ${{ env.DOCKER_REGISTRY }}/${{ matrix.docker_user }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"

  # ============================================
  # JOB 2: Deploy ALL services to Minikube
  # ============================================
  deploy-to-minikube:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push'

    strategy:
      matrix:
        service: [ms-usuarios, ms-tareas, ms-notas, ms-asistencia, ms-frontend]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tools
        shell: powershell
        run: |
          Write-Host "Verifying installed tools..."
          docker --version
          minikube version
          kubectl version --client

      - name: Verify Minikube is running
        shell: powershell
        run: |
          Write-Host "Checking Minikube status..."
          minikube status
          kubectl get nodes

      #  NUEVO: Crear secret para Docker Hub (y GHCR)
      - name: Create image pull secrets
        shell: powershell
        run: |
          # Secret para Docker Hub
          kubectl create secret docker-registry dockerhub-secret `
            --docker-server=docker.io `
            --docker-username=${{ secrets.DOCKER_USERNAME }} `
            --docker-password=${{ secrets.DOCKER_PASSWORD }} `
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Secret para GHCR
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username=${{ github.actor }} `
            --docker-password=${{ secrets.GITHUB_TOKEN }} `
            --dry-run=client -o yaml | kubectl apply -f -
          
          Write-Host "Image pull secrets created/updated"

      # NUEVO: Parchear deployments con los secrets
      - name: Patch deployment with imagePullSecrets
        shell: powershell
        run: |
          Write-Host "Adding imagePullSecrets to ${{ matrix.service }}..."
          $json = '{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"dockerhub-secret\"},{\"name\":\"ghcr-secret\"}]}}}}'
          kubectl patch deployment ${{ matrix.service }} -p $json
          if ($LASTEXITCODE -eq 0) {
            Write-Host " ImagePullSecrets added to ${{ matrix.service }}"
          } else {
            Write-Host " Failed to patch ${{ matrix.service }}"
            exit 1
          }

      #  MODIFICADO: Usar Docker Hub para TODOS los servicios
      - name: Update deployment image
        shell: powershell
        run: |
          $fullImage = "docker.io/r3mr1z4/${{ matrix.service }}:${{ github.sha }}"
          Write-Host "Updating ${{ matrix.service }} to image: $fullImage"
          kubectl set image deployment/${{ matrix.service }} ${{ matrix.service }}=$fullImage
          
          $policyJson = '{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"${{ matrix.service }}\",\"imagePullPolicy\":\"Always\"}]}}}}'
          kubectl patch deployment ${{ matrix.service }} -p $policyJson
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host " Image updated and pull policy set to Always for ${{ matrix.service }}"
          } else {
            Write-Host " Failed to update ${{ matrix.service }}"
            exit 1
          }

      - name: Verify rollout
        id: rollout
        shell: powershell
        run: |
          Write-Host "Waiting for rollout of ${{ matrix.service }}..."
          kubectl rollout status deployment/${{ matrix.service }} --timeout=5m
          Write-Host "Rollout of ${{ matrix.service }} completed"

      - name: Automatic Rollback on Failure
        if: failure() && steps.rollout.outcome == 'failure'
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "⚠️ ROLLBACK: ${{ matrix.service }} failed to rollout!"
          Write-Host "========================================"
          kubectl rollout undo deployment/${{ matrix.service }}
          kubectl rollout status deployment/${{ matrix.service }} --timeout=3m
          Write-Host "Rollback completed"

      - name: Check pod status
        shell: powershell
        run: |
          Write-Host "Pod status for ${{ matrix.service }}:"
          kubectl get pods -l app=${{ matrix.service }}
          kubectl get svc ${{ matrix.service }}-service 2>$null

      - name: Deployment summary
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "${{ matrix.service }} deployed successfully"
          Write-Host "Image: docker.io/r3mr1z4/${{ matrix.service }}:${{ github.sha }}"
          Write-Host "========================================"

  # ============================================
  # JOB 3: Success notification
  # ============================================
  notify-success:
    name: Notify pipeline success
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-minikube]
    if: github.event_name == 'push' && success()

    steps:
      - name: Notify success
        run: |
          echo "========================================"
          echo "PIPELINE CI/CD COMPLETED SUCCESSFULLY"
          echo "========================================"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Target environment: Minikube"
          echo "All images pushed to Docker Hub and GHCR"
          echo "========================================"

  # ============================================
  # JOB 4: Failure notification
  # ============================================
  notify-failure:
    name: Notify pipeline failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-minikube]
    if: github.event_name == 'push' && failure()

    steps:
      - name: Notify failure
        run: |
          echo "========================================"
          echo " PIPELINE CI/CD FAILED"
          echo "========================================"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs for more details"
          echo "========================================"
          exit 1