global:
  scrape_interval: 15s      # Intervalo para recolectar métricas
  evaluation_interval: 15s  # Intervalo para evaluar reglas
  external_labels:
    monitor: 'tesis-final'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

rule_files: []
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Monitoreo de Prometheus mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitoreo de Node Exporter (métricas del host)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Monitoreo de cAdvisor (métricas de contenedores)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Microservicio de Usuarios (si expone métricas en /metrics)
  - job_name: 'servicio-usuarios'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['servicio-usuarios:3001']

  # Microservicio de Tareas
  - job_name: 'servicio-tareas'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['servicio-tareas:3002']

  # Microservicio de Notas
  - job_name: 'servicio-notas'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['servicio-notas:3003']

  # Microservicio de Asistencia
  - job_name: 'servicio-asistencia'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['servicio-asistencia:3004']