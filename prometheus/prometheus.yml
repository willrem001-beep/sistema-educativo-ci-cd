global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tesis-final'

scrape_configs:
  # 1. Prometheus (Se auto-monitoriza)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Microservicio de Usuarios
  # IMPORTANTE: Usa la IP de Minikube y el NodePort (30001)
  - job_name: 'ms-usuarios'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:65229']
        labels:
          app: 'usuarios'

  # 3. Microservicio de Tareas (Puerto 30002)
  - job_name: 'ms-tareas'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:58315']
        labels:
          app: 'tareas'

  # 4. Microservicio de Notas (Puerto 30003)
  - job_name: 'ms-notas'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:58323']
        labels:
          app: 'notas'

  # 5. Microservicio de Asistencia (Puerto 30004)
  - job_name: 'ms-asistencia'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:61054']
        labels:
          app: 'asistencia'


   # CADVISOR
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # NODE EXPORTER
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
      
  # KUBE-STATE-METRICS 
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']  # Puerto del port-forward
    scrape_interval: 15s