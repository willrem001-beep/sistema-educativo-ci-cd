global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tesis-final'

scrape_configs:
  # Prometheus mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Microservicio de Usuarios
  - job_name: 'ms-usuarios'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ms-usuarios.default.svc.cluster.local:3001']
    # Si aún no tienes endpoint /metrics, comenta temporalmente
    # scrape_timeout: 5s

  # Microservicio de Tareas
  - job_name: 'ms-tareas'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ms-tareas.default.svc.cluster.local:3002']

  # Microservicio de Notas
  - job_name: 'ms-notas'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ms-notas.default.svc.cluster.local:3003']

  # Microservicio de Asistencia
  - job_name: 'ms-asistencia'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ms-asistencia.default.svc.cluster.local:3004']

  # Frontend
  - job_name: 'ms-frontend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ms-frontend.default.svc.cluster.local:80']