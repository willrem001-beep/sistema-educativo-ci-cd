apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-asistencia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-asistencia
  template:
    metadata:
      labels:
        app: ms-asistencia
    spec:
      containers:
      - name: ms-asistencia
        image: ghcr.io/willrem001-beep/sistema-educativo-ci-cd/ms-asistencia:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3004
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/db_asistencia"